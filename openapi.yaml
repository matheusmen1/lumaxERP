      summary: Apaga usuário
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Sucesso

  # ==========================================
  # TEMPLATE: CATEGORIA
  # ==========================================
  /apis/categoria:
    get:
      tags: [Categoria]
      summary: Lista categorias
      responses:
        '200':

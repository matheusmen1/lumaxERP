components:
  schemas:
    Cliente:
      type: object
      properties:
        nome: { type: string }
        cpf: { type: string }
        telefone: { type: string }
        email: { type: string }
        endereco: { type: string }
        cidade: { type: string }
        cep: { type: string }
        numero: { type: integer }
        estado: { type: string }
        bairro: { type: string }
    Produto:
      type: object
      properties:
        nome: { type: string }
        descricao: { type: string }
        valor: { type: number }
        valorCasco: { type: number }
        categoria:
          type: object
          properties:
            id: { type: integer }
        fornecedor:
          type: object
          properties:
            id: { type: integer }

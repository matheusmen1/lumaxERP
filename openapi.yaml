            type: integer
      responses:
        '200':
          description: Sucesso

  # ==========================================
  # TEMPLATE: TIPO DESPESA
  # ==========================================
  /apis/tipo-despesa:
    get:
      tags: [Tipo Despesa]
      summary: Lista tipos de despesa
      responses:
        '200':
          description: Sucesso
    post:
      tags: [Tipo Despesa]
      summary: Cadastra tipo de despesa
      responses:
        '200':
          description: Sucesso
    put:
      tags: [Tipo Despesa]
      summary: Atualiza tipo de despesa
      responses:
        '200':

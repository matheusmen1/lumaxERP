openapi: 3.0.3
info:
  title: LumaxERP API
  description: Documentação das rotas do sistema de gestão LumaxERP (Loja de Baterias).
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Servidor Local

tags:
  - name: Produto
  - name: Cliente
  - name: Fornecedor
  - name: Usuário
  - name: Categoria
  - name: Tipo Despesa
  - name: Tipo Pagamento

paths:
  # ==========================================
  # TEMPLATE: CLIENTE
  # ==========================================
  /apis/cliente:
    get:
      tags: [Cliente]
      summary: Lista todos os clientes
      responses:
        '200':
          description: Sucesso
        '400':
          description: Nenhum Cliente Encontrado
    post:
      tags: [Cliente]
      summary: Cadastra um novo cliente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Cliente'
      responses:
        '200':
          description: Cliente salvo com sucesso
        '400':
          description: Erro ao Gravar Cliente
    put:
      tags: [Cliente]
      summary: Atualiza um cliente existente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Cliente'
      responses:
        '200':
          description: Cliente atualizado com sucesso
        '400':
          description: Erro ao Alterar Cliente

  /apis/cliente/{id}:
    get:
      tags: [Cliente]
      summary: Busca um cliente pelo ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Sucesso
        '400':
          description: Cliente Não Encontrado
    delete:
      tags: [Cliente]
      summary: Remove um cliente pelo ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Cliente removido com sucesso
        '400':
          description: Erro ao Apagar Cliente

  # ==========================================
  # TEMPLATE: PRODUTO
  # ==========================================
  /apis/produto:
    get:
      tags: [Produto]
      summary: Lista todos os produtos
      responses:
        '200':
          description: Sucesso
        '400':
          description: Nenhum Produto Encontrado
    post:
      tags: [Produto]
      summary: Cadastra um novo produto
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Produto'
      responses:
        '200':
          description: Sucesso
        '400':
          description: Erro ao Gravar Produto
    put:
      tags: [Produto]
      summary: Atualiza um produto
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Produto'
      responses:
        '200':
          description: Sucesso
        '400':
          description: Erro ao Alterar Produto

  /apis/produto/{id}:
    get:
      tags: [Produto]
      summary: Busca um produto pelo ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Sucesso
        '400':
          description: Produto Não Encontrado
    delete:
      tags: [Produto]
      summary: Remove um produto pelo ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Sucesso
        '400':
          description: Erro ao Apagar Produto

  # ==========================================
  # TEMPLATE: FORNECEDOR
  # ==========================================
  /apis/fornecedor:
    get:
      tags: [Fornecedor]
      summary: Lista todos os fornecedores
      responses:
        '200':
          description: Sucesso
    post:
      tags: [Fornecedor]
      summary: Cadastra fornecedor
      responses:
        '200':
          description: Sucesso
    put:
      tags: [Fornecedor]
      summary: Atualiza fornecedor
      responses:
        '200':
          description: Sucesso
  /apis/fornecedor/{id}:
    get:
      tags: [Fornecedor]
      summary: Busca fornecedor
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Sucesso
    delete:
      tags: [Fornecedor]
      summary: Apaga fornecedor
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Sucesso

  # ==========================================
  # TEMPLATE: USUARIO
  # ==========================================
  /apis/usuario:

openapi: 3.0.3
info:
  title: LumaxERP API
  description: Documentação das rotas do sistema de gestão LumaxERP (Loja de Baterias).
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Servidor Local

tags:
  - name: Produto
  - name: Cliente
  - name: Fornecedor
  - name: Usuário
  - name: Categoria
  - name: Tipo Despesa
  - name: Tipo Pagamento
  - name: Venda
  - name: Entrada Estoque

paths:
  # ==========================================
  # TEMPLATE: CLIENTE
  # ==========================================
  /apis/cliente:
    get:
      tags: [Cliente]
      summary: Lista todos os clientes
      responses:
        '200':
          description: Sucesso
        '400':
          description: Nenhum Cliente Encontrado
    post:
      tags: [Cliente]
      summary: Cadastra um novo cliente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Cliente'
      responses:
        '200':
          description: Cliente salvo com sucesso
        '400':
          description: Erro ao Gravar Cliente
    put:
      tags: [Cliente]
      summary: Atualiza um cliente existente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Cliente'
      responses:
        '200':
          description: Cliente atualizado com sucesso
        '400':
          description: Erro ao Alterar Cliente

  /apis/cliente/{id}:
    get:
      tags: [Cliente]
      summary: Busca um cliente pelo ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Sucesso
        '400':
          description: Cliente Não Encontrado
    delete:
      tags: [Cliente]
      summary: Remove um cliente pelo ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Cliente removido com sucesso
        '400':
          description: Erro ao Apagar Cliente

  # ==========================================
  # TEMPLATE: PRODUTO
  # ==========================================
  /apis/produto:
    get:
      tags: [Produto]
      summary: Lista todos os produtos
      responses:
        '200':
          description: Sucesso
        '400':
          description: Nenhum Produto Encontrado
    post:
      tags: [Produto]
      summary: Cadastra um novo produto
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Produto'
      responses:
        '200':
          description: Sucesso
        '400':
          description: Erro ao Gravar Produto
    put:
      tags: [Produto]
      summary: Atualiza um produto
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Produto'
      responses:
        '200':
          description: Sucesso
        '400':
          description: Erro ao Alterar Produto

  /apis/produto/fornecedor/{id}:
    get:
      tags: [Produto]
      summary: Lista produtos de um fornecedor específico
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Sucesso
        '400':
          description: Nenhum Produto Encontrado para este Fornecedor

  /apis/produto/categoria/{id}:
    get:
      tags: [Produto]
      summary: Lista produtos de uma categoria específica
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Sucesso
        '400':
          description: Nenhum Produto Encontrado para esta Categoria

  /apis/produto/disponiveis:
    get:
      tags: [Produto]
      summary: Lista apenas os produtos que possuem estoque disponível (> 0)
      responses:
        '200':
          description: Sucesso
        '400':
          description: Nenhum Produto com Estoque Disponível

  /apis/produto/{id}:
    get:
      tags: [Produto]
      summary: Busca um produto pelo ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Sucesso
        '400':
          description: Produto Não Encontrado
    delete:
      tags: [Produto]
      summary: Remove um produto pelo ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Sucesso
        '400':
          description: Erro ao Apagar Produto

  # ==========================================
  # TEMPLATE: FORNECEDOR
  # ==========================================
  /apis/fornecedor:
    get:
      tags: [Fornecedor]
      summary: Lista todos os fornecedores
      responses:
        '200':
          description: Sucesso
    post:
      tags: [Fornecedor]
      summary: Cadastra fornecedor
      responses:
        '200':
          description: Sucesso
    put:
      tags: [Fornecedor]
      summary: Atualiza fornecedor
      responses:
        '200':
          description: Sucesso
  /apis/fornecedor/{id}:
    get:
      tags: [Fornecedor]
      summary: Busca fornecedor
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Sucesso
    delete:
      tags: [Fornecedor]
      summary: Apaga fornecedor
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Sucesso

  # ==========================================
  # TEMPLATE: USUARIO
  # ==========================================
  /apis/usuario:
    get:
      tags: [Usuário]
      summary: Lista todos os usuários
      responses:
        '200':
          description: Sucesso
    post:
      tags: [Usuário]
      summary: Cadastra usuário
      responses:
        '200':
          description: Sucesso
    put:
      tags: [Usuário]
      summary: Atualiza usuário
      responses:
        '200':
          description: Sucesso
  /apis/usuario/{id}:
    get:
      tags: [Usuário]
      summary: Busca usuário
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Sucesso
    delete:
      tags: [Usuário]
      summary: Apaga usuário
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Sucesso

  # ==========================================
  # TEMPLATE: CATEGORIA
  # ==========================================
  /apis/categoria:
    get:
      tags: [Categoria]
      summary: Lista categorias
      responses:
        '200':
          description: Sucesso
    post:
      tags: [Categoria]
      summary: Cadastra categoria
      responses:
        '200':
          description: Sucesso
    put:
      tags: [Categoria]
      summary: Atualiza categoria
      responses:
        '200':
          description: Sucesso
  /apis/categoria/{id}:
    get:
      tags: [Categoria]
      summary: Busca categoria
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Sucesso
    delete:
      tags: [Categoria]
      summary: Apaga categoria
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Sucesso

  # ==========================================
  # TEMPLATE: TIPO DESPESA
  # ==========================================
  /apis/tipo-despesa:
    get:
      tags: [Tipo Despesa]
      summary: Lista tipos de despesa
      responses:
        '200':
          description: Sucesso
    post:
      tags: [Tipo Despesa]
      summary: Cadastra tipo de despesa
      responses:
        '200':
          description: Sucesso
    put:
      tags: [Tipo Despesa]
      summary: Atualiza tipo de despesa
      responses:
        '200':
          description: Sucesso
  /apis/tipo-despesa/{id}:
    get:
      tags: [Tipo Despesa]
      summary: Busca tipo de despesa
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Sucesso
    delete:
      tags: [Tipo Despesa]
      summary: Apaga tipo de despesa
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Sucesso

  # ==========================================
  # TEMPLATE: TIPO PAGAMENTO
  # ==========================================
  /apis/tipo-pagamento:
    get:
      tags: [Tipo Pagamento]
      summary: Lista tipos de pagamento
      responses:
        '200':
          description: Sucesso
    post:
      tags: [Tipo Pagamento]
      summary: Cadastra tipo de pagamento
      responses:
        '200':
          description: Sucesso
    put:
      tags: [Tipo Pagamento]
      summary: Atualiza tipo de pagamento
      responses:
        '200':
          description: Sucesso
  /apis/tipo-pagamento/{id}:
    get:
      tags: [Tipo Pagamento]
      summary: Busca tipo de pagamento
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Sucesso
    delete:
      tags: [Tipo Pagamento]
      summary: Apaga tipo de pagamento
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Sucesso

  # ==========================================
  # VENDA (baixa estoque; vendedor vem do token JWT)
  # ==========================================
  /apis/venda:
    get:
      tags: [Venda]
      summary: Lista as vendas (mais recentes primeiro)
      responses:
        '200':
          description: Sucesso
        '400':
          description: Nenhuma Venda Encontrada
    post:
      tags: [Venda]
      summary: Registra uma venda e baixa o estoque (transação única)
      description: >
        O vendedor é obtido do token JWT. O valor unitário vem do cadastro do produto;
        com casco entregue, desconta o valor do casco. Item com número de série exige quantidade 1.
        Retorna 400 com "Estoque insuficiente ..." se não houver saldo.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VendaRequest'
      responses:
        '200':
          description: Venda registrada
        '400':
          description: Regra de negócio violada (ex.: estoque insuficiente)
  /apis/venda/filtro/{filtro}:
    get:
      tags: [Venda]
      summary: Busca vendas pelo nome ou CPF do cliente
      parameters:
        - in: path
          name: filtro
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Sucesso
        '400':
          description: Nenhuma Venda Encontrada
  /apis/venda/cliente/{id}:
    get:
      tags: [Venda]
      summary: Busca vendas de um cliente específico
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Sucesso
        '400':
          description: Nenhuma Venda Encontrada para este Cliente
  /apis/venda/usuario/{id}:
    get:
      tags: [Venda]
      summary: Busca vendas de um vendedor específico
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Sucesso
        '400':
          description: Nenhuma Venda Encontrada para este Vendedor
  /apis/venda/{id}:
    get:
      tags: [Venda]
      summary: Busca uma venda pelo ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Sucesso
        '400':
          description: Venda Não Encontrada
    delete:
      tags: [Venda]
      summary: Exclui a venda e devolve os itens ao estoque (somente administrador)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Sucesso
        '403':
          description: Não autorizado (nível diferente de administrador)

  # ==========================================
  # ENTRADA DE ESTOQUE (soma ao estoque; responsável vem do token JWT)
  # ==========================================
  /apis/entrada-estoque:
    get:
      tags: [Entrada Estoque]
      summary: Lista as entradas de estoque (mais recentes primeiro)
      responses:
        '200':
          description: Sucesso
        '400':
          description: Nenhuma Entrada de Estoque Encontrada
    post:
      tags: [Entrada Estoque]
      summary: Registra uma entrada de mercadoria e soma ao estoque (transação única)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntradaEstoqueRequest'
      responses:
        '200':
          description: Entrada registrada
        '400':
          description: Regra de negócio violada
  /apis/entrada-estoque/filtro/{filtro}:
    get:
      tags: [Entrada Estoque]
      summary: Busca entradas pela razão social ou CNPJ do fornecedor
      parameters:
        - in: path
          name: filtro
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Sucesso
        '400':
          description: Nenhuma Entrada de Estoque Encontrada
  /apis/entrada-estoque/fornecedor/{id}:
    get:
      tags: [Entrada Estoque]
      summary: Busca entradas de um fornecedor específico
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Sucesso
        '400':
          description: Nenhuma Entrada de Estoque Encontrada para este Fornecedor
  /apis/entrada-estoque/{id}:
    get:
      tags: [Entrada Estoque]
      summary: Busca uma entrada pelo ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Sucesso
        '400':
          description: Entrada de Estoque Não Encontrada
    delete:
      tags: [Entrada Estoque]
      summary: Exclui a entrada e retira do estoque (somente administrador; bloqueia se já foi vendida)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Sucesso
        '400':
          description: Parte do estoque da entrada já foi vendida
        '403':
          description: Não autorizado (nível diferente de administrador)

components:
  schemas:
    Cliente:
      type: object
      properties:
        nome: { type: string }
        cpf: { type: string }
        telefone: { type: string }
        email: { type: string }
        endereco: { type: string }
        cidade: { type: string }
        cep: { type: string }
        numero: { type: integer }
        estado: { type: string }
        bairro: { type: string }
    Produto:
      type: object
      properties:
        nome: { type: string }
        descricao: { type: string }
        valor: { type: number }
        valorCasco: { type: number }
        estoque:
          type: integer
          readOnly: true
          description: Saldo em estoque. Alterado somente por vendas e entradas de estoque.
        categoria:
          type: object
          properties:
            id: { type: integer }
        fornecedor:
          type: object
          properties:
            id: { type: integer }
    VendaRequest:
      type: object
      required: [clienteId, tipoPagamentoId, itens]
      properties:
        clienteId: { type: integer }
        tipoPagamentoId: { type: integer }
        itens:
          type: array
          items:
            type: object
            required: [produtoId, quantidade]
            properties:
              produtoId: { type: integer }
              quantidade: { type: integer, minimum: 1 }
              cascoEntregue: { type: boolean }
              numeroSerie: { type: string, description: Se informado, a quantidade deve ser 1 }
              mesesGarantia: { type: integer }
    EntradaEstoqueRequest:
      type: object
      required: [fornecedorId, itens]
      properties:
        fornecedorId: { type: integer }
        itens:
          type: array
          items:
            type: object
            required: [produtoId, quantidade, custoUnitario]
            properties:
              produtoId: { type: integer }
              quantidade: { type: integer, minimum: 1 }
              custoUnitario: { type: number }
